<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10251d">
  <title>Sapphire Tech Wizard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #426d50, transparent 60%),
        #10251d;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 35px 22px;
      background: rgba(5, 20, 13, 0.85);
      border: 1px solid #426d50;
      border-radius: 22px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.4);
    }

    .logo {
      width: 220px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 25px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 12px #ff00e6);
    }

    h1 {
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 2px;
    }

    h1 span {
      color: #ff00e6;
    }

    .subtitle {
      margin-top: 15px;
      color: #c2d8c9;
      font-size: 15px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 16px;
      border: 1px solid #426d50;
      border-radius: 30px;
      color: #baffca;
      font-size: 13px;
    }

    .status::before {
      content: "● ";
      color: #55ff88;
    }

    footer {
      margin-top: 30px;
      color: #88a994;
      font-size: 11px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- Replace logo.png with your image filename -->
    <img
      src="logo.png"
      alt="Sapphire Tech Wizard Logo"
      class="logo"
    >

    <h1>
      SAPPHIRE <span>TECH</span><br>
      WIZARD
    </h1>

    <p class="subtitle">
      Technology • Innovation • Digital Solutions
    </p>

    <div class="status">
      Your Digital Magic Starts Here
    </div>

    <footer>
      BUILT FOR THE FUTURE
    </footer>

  </main>
</body>
  </html>
